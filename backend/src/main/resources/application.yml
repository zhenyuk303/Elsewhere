server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/elsewhere;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
elsewhere:
  demo:
    enabled: ${ELSEWHERE_DEMO_USERS:false}
    password: ${ELSEWHERE_DEMO_PASSWORD:}
  oauth:
    google:
      client-id: ${CLIENT_ID_GOOGLE:}
      client-secret: ${CLIENT_SECRET_GOOGLE:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://127.0.0.1:5173/api/auth/oauth/google/callback}
    github:
      client-id: ${CLIENT_ID_GITHUB:}
      client-secret: ${CLIENT_SECRET_GITHUB:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://127.0.0.1:5173/api/auth/oauth/github/callback}
