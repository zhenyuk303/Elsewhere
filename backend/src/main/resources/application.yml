server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/elsewhere;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
elsewhere:
  demo:
    enabled: ${ELSEWHERE_DEMO_USERS:false}
    password: ${ELSEWHERE_DEMO_PASSWORD:}
  oauth:
    qq:
      app-id: ${QQ_APP_ID:}
      app-secret: ${QQ_APP_SECRET:}
      redirect-uri: ${QQ_REDIRECT_URI:}
    wechat:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      redirect-uri: ${WECHAT_REDIRECT_URI:}
