server:
  port: ${PORT:8080}
spring:
  config:
    import: "optional:file:./backend/.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/elsewhere?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:elsewhere}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
elsewhere:
  auth:
    secure-cookies: ${ELSEWHERE_SECURE_COOKIES:false}
  demo:
    enabled: ${ELSEWHERE_DEMO_USERS:false}
    password: ${ELSEWHERE_DEMO_PASSWORD:}
  oauth:
    google:
      client-id: ${CLIENT_ID_GOOGLE:}
      client-secret: ${CLIENT_SECRET_GOOGLE:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://127.0.0.1:5173/api/auth/oauth/google/callback}
    github:
      client-id: ${CLIENT_ID_GITHUB:}
      client-secret: ${CLIENT_SECRET_GITHUB:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://127.0.0.1:5173/api/auth/oauth/github/callback}
